version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
    env_file: .env.production
    ports:
      - "3001:3001"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.production
    env_file: .env.production
    ports:
      - "3000:3000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
    command: ["node", "dist/worker"]
    env_file: .env.production
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - internal

networks:
  internal:
    driver: bridge
